name: Retire merged MAP 2 source branches
on:
  push:
    branches: [M2-P01-baseline-loader]
permissions:
  contents: write
jobs:
  retire:
    if: ${{ contains(github.event.head_commit.message, 'RETIRE_BRANCHES_NOW') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate final canonical sources
        run: |
          python tools/rebuild.py
          node --check dist/bundle.js
          node tests/canonical-sources.cjs
          git diff --check
      - name: Confirm branches are merged into main working branch
        run: |
          git fetch origin DECOR ATLAS_CAN_DUYET fix/shop-name-audit
          for branch in DECOR ATLAS_CAN_DUYET fix/shop-name-audit; do
            git merge-base --is-ancestor "origin/$branch" HEAD || { echo "History not retained: $branch"; exit 1; }
          done
          test -f examples/WIZAMAP_FIXED_UI.html
          test -f examples/WIZAMAP_ASSETS.html
          test -f examples/WIZAMAP_LAYOUTS.html
          test -f PROJECT_INSTRUCTION.md
          test -f assets/atlas.json
      - name: Delete only redundant integrated branches, keep main and target
        run: |
          git push origin --delete DECOR ATLAS_CAN_DUYET fix/shop-name-audit
