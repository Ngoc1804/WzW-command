name: Build MAP 2 canonical sources
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published runtime pin against exact dist bytes
        run: python tools/check-release-pin.py
      - name: Build and validate source inventory
        run: |
          python tools/rebuild.py
          node --check dist/bundle.js
          node tests/canonical-sources.cjs
          git diff --check
          git diff --exit-code
      - name: Install headless browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1 linkedom@0.18.12 @napi-rs/canvas@0.1.100
          npx playwright install --with-deps chromium
          CHROMIUM_BIN=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          sudo ln -sf "$CHROMIUM_BIN" /usr/bin/chromium
          mkdir -p work
      - name: Runtime and 147-layout regression tests
        run: |
          set -e
          python tools/check-id-links.py
          python tools/test_all.py
      - name: Upload 15-case QA screenshots and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map2-15-case-visual-qa
          path: |
            work/qa15/
            work/presentation-*.png
            work/inspector-*.png
            work/furniture-variants*
            work/furniture-unit-qa.json
            work/furniture-render-qa.json
            work/preview-*.png
            work/test-all.json
          if-no-files-found: warn
          retention-days: 7
