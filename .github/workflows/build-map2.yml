name: Build MAP 2 canonical sources
on:
  push:
    branches: [DEMO-01]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'DECOR_IMPORT_NOW') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate source inventory
        run: |
          python tools/rebuild.py
          node --check dist/bundle.js
          node tests/canonical-sources.cjs
          git diff --check
      - name: Install headless browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          CHROMIUM_BIN=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          sudo ln -sf "$CHROMIUM_BIN" /usr/bin/chromium
          mkdir -p work
      - name: Runtime and 147-layout regression tests
        run: |
          set -e
          python tools/check-id-links.py
          python tools/test_all.py
      - name: Upload 15-case QA screenshots and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map2-15-case-visual-qa
          path: work/qa15/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish generated artifacts to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/WIZAMAP_FIXED_UI.html examples/WIZAMAP_ASSETS.html dist/ docs/build-metrics.json assets/runtime-release.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate canonical MAP 2 artifacts [skip ci]'
            git push origin HEAD:${{ github.ref_name }}
          fi
